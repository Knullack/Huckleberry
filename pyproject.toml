[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huckleberry-ha-integration"
version = "0.1.0"
description = "Home Assistant custom integration for Huckleberry"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "adn51" }]
dependencies = [
  "huckleberry-api==0.4.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2",
  "mypy>=1.11.2",
  "types-python-dateutil>=2.9.0.20240316",
  "pre-commit>=3.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_configs = true
pretty = true
show_error_codes = true
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "huckleberry_api.*", "voluptuous.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=custom_components.huckleberry --cov-report=term-missing --cov-fail-under=25"
