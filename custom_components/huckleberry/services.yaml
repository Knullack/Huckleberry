  fields:
    child_uid:
      name: Child UID
      description: Optional when one child is configured; required for multi-child setups.
      required: false
      selector:
        text:
    child_name:
      name: Child Name
      description: Optional configured child name; use this instead of child_uid.
      required: false
      selector:
        text:

complete_sleep:
